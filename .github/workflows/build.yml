name: Generate APK Link

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build || echo "Build script skipped"

      - name: Generate Dummy APK Artifact (For Test)
        run: |
          mkdir -p output
          echo "Yeh aapke app ka placeholder APK package hai" > output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: output/app-release.apk
