name: Generate APK Link

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Web App
        run: |
          npm install
          npm run build || echo "No build script needed"

      - name: Note for APK
        run: |
          echo "Aapka project yahan ready ho gaya hai. PWABuilder ya Bubblewrap ke zariye automated APK yahan configure ki ja sakti hai."
